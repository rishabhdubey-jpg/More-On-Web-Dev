<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball</title>

<style>
    body {
        margin: 0;
        height: 123vh;
        background: cornsilk;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
        overflow: hidden;
    }

    #ball {
        width: 60px;
        height: 60px;
        background: radial-gradient(circle at top, #d9b8ff, #581c7d);
        border-radius: 50%;
        position: absolute;
        top: 0;
        animation: bounce 1.8s infinite ease-in-out;
    }

    #upper {
        width: 60px;
        height: 30px;
        background: rgba(255, 255, 255, 0.3);
        border-top-left-radius: 60px;
        border-top-right-radius: 60px;
    }

    @keyframes bounce {
        0% {
            top: 0;
            transform: scale(1, 1) rotate(360deg);
        }

        40% {
            transform: scale(1, 1) ;
        }

        50% {
            top: 75%;
            transform: scale(1.2, 0.8) ;
        }

        60% {
            transform: scale(0.9, 1.1);
        }

        100% {
            top: 0;
            transform: scale(1, 1) rotate(360deg);
        }
    }
</style>
</head>

<body>
    <div id="ball">
        <div id="upper"></div>
    </div>
</body>
</html>

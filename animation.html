<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
</head>
<style>
    div{
        background-color: yellowgreen;
        height: 200px;
        width: 300px;
        animation-name: any;
        animation-duration: 3s;
        /* animation-iteration-count: 2; it will run two times */
        animation-iteration-count: infinite; /* infinite; it will run infinite times */
        /* animation-delay: 3s; it will start after 3 seconds */
        /* animation-direction: alternate; it will run forward and backward */
        /* animation-play-state: paused; it will pause the animation */


        /* transition: 3s; */
    }
    div:hover {
        /* animation-play-state: running; it will run the animation on hover */
    }
    @keyframes any{
        0%{
            background-color: cadetblue;
            height: 500px;
            width: 500px;
            border-radius: 50%;
        }
        25%{
            background-color: cornflowerblue;
            transform: rotateX(90deg);
        }
        50%{
            background-color: black;
            transform: rotateY(90deg);
        }
        100%{
            height: 200px;
            width: 200px;
            border-radius: 0%;
            transform: rotateX(0deg) rotateY(0deg);
    }
}
    div:hover{
        background-color: bisque;
    }
</style>
<body>
    <h2>Animations</h2>
    <div></div>
</body>
</html>
